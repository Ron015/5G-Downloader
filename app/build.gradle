plugins { id 'com.android.application' }

android { namespace 'com.networkmonitorpro'; compileSdk 35
    defaultConfig { applicationId 'com.networkmonitorpro'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0.0' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.github.tonyofrancis.Fetch:fetch2:3.1.6'
}
